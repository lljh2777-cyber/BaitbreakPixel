table{width:100%;border-collapse:collapse;font-size:14px}td{padding:10px;border-bottom:1px solid #355058}select{font:inherit;background:#16323b;color:inherit;padding:8px;max-width:100%}</style></head><body><main><div class="eyebrow">M03 / A / ROUND 02</div><h1>暖光沙湾 · 芦苇与沙面群落</h1><p>沿用选定的 A：左侧芦苇是主要植物形体，坡脚低草逐渐变稀；右侧只放少量宽叶植物与石面苔藻，保留开阔水道。</p><div class="controls"><button data-id="terrain" aria-pressed="false">第一轮 · 裸地势</button><button data-id="plants" aria-pressed="true">第二轮 · 植物群落</button></div><figure><img id="main-image" src="A-reed-communities.png" width="2048" height="768" alt="A 暖光沙湾植物群落"><figcaption id="caption">第二轮：左岸芦苇、坡脚矮草、泥沙藻斑与右缘宽叶植物。</figcaption></figure><h2>前后对照</h2><div class="pair"><figure><img src="../round1/A-sunlit-sand-bay.png" alt="原 A 裸地势"><figcaption>第一轮</figcaption></figure><figure><img src="A-reed-communities.png" alt="植物群落"><figcaption>第二轮</figcaption></figure></div><p class="note">植物和地势仍烘焙在同一张概念图；没有新增交互目标、碰撞或动物。此图不是游戏截图，也不是已拆分透明资源。中央留白仍需后续实机验证。</p><p><a href="REPORT.md">本轮报告</a> · <a href="prompt.json">内置 image_gen 提示词</a> · <a href="../round1/gallery.html">第一轮历史方案</a> · <a href="../../README.md">系列进度</a></p></main><script>const variants={"terrain": {"file": "../round1/A-sunlit-sand-bay.png", "caption": "第一轮：A 暖光沙湾，裸地势。"}, "plants": {"file": "A-reed-communities.png", "caption": "第二轮：左岸芦苇、坡脚矮草、泥沙藻斑与右缘宽叶植物。"}};document.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>{const v=variants[b.dataset.id];document.getElementById("main-image").src=v.file;document.getElementById("main-image").alt=v.caption;document.getElementById("caption").textContent=v.caption;document.querySelectorAll("[data-id]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));}));</script></body></html>

</style></head><body><main><div class="eyebrow">NATURAL POND SERIES / M02 / ROUND 01</div><h1>老根幽潭 · 岸根与阴影水域</h1><p>本轮只比较裸露死木根、泥岸、石块、水色与光照。保持中央水域连续，避免根系织成挡住视线的枝网。</p><div class="controls"><button data-id="A" aria-pressed="true">A · 老树阴岸（推荐）</button><button data-id="B" aria-pressed="false">B · 倒根泥湾</button></div><figure><img id="main-image" src="A-shaded-tree-bank.png" width="2048" height="768" alt="M02 A 左侧老树阴岸"><figcaption id="caption">A：老树基部集中在左侧，右上柔光照入宽阔水域；与 M01 的右石棚重心不同。</figcaption></figure><h2>两套完整构图</h2><div class="pair"><figure><a href="A-shaded-tree-bank.png"><img src="A-shaded-tree-bank.png" width="2048" height="768" alt="A 老树阴岸全景"></a><figcaption>A · 站立树基、根系沿左岸向下展开</figcaption></figure><figure><a href="B-upturned-root-cove.png"><img src="B-upturned-root-cove.png" width="2048" height="768" alt="B 倒根泥湾全景"></a><figcaption>B · 倒伏根盘、右岸低泥湾</figcaption></figure></div><p class="note">2048×768 美术概念图，不是游戏截图；目前没有植物、动物或真实交互。先选择构图，再进入植物群落，不自动沿用 M01 的 B 选择。</p><p><a href="REPORT.md">报告与改动范围</a> · <a href="prompts.json">内置 image_gen 完整提示词</a> · <a href="../../README.md">系列进度</a> · <a href="../../M01-stone-bay/layers/index.html">M01 分层交接</a></p><footer>2026-10-06 · feature/watergen-v2 · 真实地图与玩法未修改。</footer></main><script>

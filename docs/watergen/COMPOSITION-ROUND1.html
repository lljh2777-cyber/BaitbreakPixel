<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>水下构图 · 第一轮 A / B / C</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102930;color:#dce7db;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1360px;margin:auto;padding:36px 28px}small{color:#91b0a7;letter-spacing:.1em}h1{font-size:32px;margin:6px 0 12px}p{color:#a9c0b6;max-width:970px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 20px}button,select{font:inherit;background:#1b3940;color:inherit;border:1px solid #3c5a5f;border-radius:8px;padding:10px 16px;cursor:pointer}button:hover{border-color:#adc3a0}button[aria-pressed=true]{background:#345249;border-color:#bac5a2}.choices button{text-align:left;padding:18px}.choices strong{font-size:20px;display:block}.choices span{display:block;color:#b1c4b9;font-size:14px;margin-top:4px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}figure{margin:0;border:1px solid #3a5558;background:#0c242c;border-radius:10px;overflow:hidden}figure img{display:block;width:100%;image-rendering:pixelated;object-fit:contain;min-height:230px}figure.native img{max-width:960px;margin:auto}figcaption{padding:12px 18px;color:#b6cabc;font-size:14px;border-top:1px solid #3a5558}.note{font-size:14px;margin-top:18px}a{color:#bad6c0}@media(max-width:760px){main{padding:20px 12px}.choices{grid-template-columns:1fr}.choices button{padding:12px}h1{font-size:26px}}
</style>
<main><small>BAITBREAK PIXEL / COMPOSITION STUDIES / ROUND 01</small>
<h1>地形与大构图 · 第一轮重做</h1>
<p>这轮只看长坡、宽谷与一个主倒木。旧圆丘、重复横木、植物和杂物暂时隐去；石块只保留集中体量。三张完整草案均为 1280 × 480。</p>
<div class="choices">
<button data-choice="A" aria-pressed="true"><strong>A · 斜木宽谷</strong><span>左高右中 · 中央宽谷 · 一根斜向倒木</span></button>
<button data-choice="B" aria-pressed="false"><strong>B · 双岸跨谷</strong><span>两侧较高 · 中部低谷 · 单根倒木跨谷</span></button>
<button data-choice="C" aria-pressed="false"><strong>C · 石坡浅湾</strong><span>左侧石坡 · 中央低谷 · 右侧长缓坡</span></button>
</div>
<div class="controls"><label>视角 <select id="mode"><option value="wide">1280 × 480 完整草案</option><option value="game">HUD 可读性叠加</option><option value="qte">鱼线 / QTE 叠加</option></select></label>
<button id="baseline" aria-pressed="false">显示原版</button><span id="label"></span></div>
<figure id="frame"><img id="scene" alt="A 方案全景"><figcaption id="caption"></figcaption></figure>
<p class="note">每套地势只保留两岸与一个宽谷，近处暗色前景只占画面约 1%。这里是冻结的美术草案，轮廓不代表碰撞；正式游戏地图保持原状。本轮未增加生态细节。</p>
<p class="note">可用 A / B / C 键切换方案，空格切换原版。<a href="COMPOSITION-ROUND1-REWORK.md">查看本轮报告与玩法隔离检查</a> · <a href="evidence/composition-round1-rework/seed-42-A-wide.png">A 原尺寸</a> · <a href="evidence/composition-round1-rework/seed-42-B-wide.png">B 原尺寸</a> · <a href="evidence/composition-round1-rework/seed-42-C-wide.png">C 原尺寸</a></p>
</main>
<script>
let choice='A',baseline=false;const mode=document.querySelector('#mode'),image=document.querySelector('#scene');
const names={A:'斜木宽谷',B:'双岸跨谷',C:'石坡浅湾'};
function render(){const s=42,m=mode.value;const file=baseline?(m==='qte'?`seed-${s}-qte-baseline.png`:`seed-${s}-baseline-${m}.png`):`seed-${s}-${choice}-${m}.png`;image.src=`evidence/composition-round1-rework/${file}`;image.alt=`${baseline?'原版':choice+' '+names[choice]} · ${m}`;document.querySelector('#label').textContent=baseline?'原版':choice+' · '+names[choice];document.querySelector('#caption').textContent=m==='wide'?'1280 × 480 · 完整静态构图草案':'640 × 360 · 原有鱼、食物、鱼线与界面叠加检查';document.querySelector('#frame').classList.toggle('native',m!=='wide');document.querySelector('#baseline').setAttribute('aria-pressed',baseline);document.querySelector('#baseline').textContent=baseline?'返回草案':'显示原版';document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.choice===choice&&!baseline))}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;baseline=false;render()});mode.onchange=render;document.querySelector('#baseline').onclick=()=>{baseline=!baseline;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const k=e.key.toUpperCase();if(names[k]){choice=k;baseline=false;render()}else if(e.code==='Space'){e.preventDefault();baseline=!baseline;render()}});render();
</script></html>
